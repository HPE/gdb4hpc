---
# config for build time
build:
  # target specific checks and rules
  targets:
    all:
      optional-modules:
      - cray-cti-devel
      directory: .

# config for test time
test:
  modules:
    - gdb4hpc

# launcher config
launch:
  # launcher args are defined per test in gdb4hpc
  args:
    slurm: "--exclusive"
    alps: ""
    ssh: ""

# having to do with the test tool itself
meta:
  keep: # don't delete these files upon -r option
    - Makefile

# system specific overides
pea2k:
  launch:
    args:
      slurm: "--exclusive --mpi=cray_shasta"

pinoak-login1:
  launch:
    args:
      slurm: "--exclusive -N1"

uan01:
  launch:
    environment:
      CTI_WLM_IMPL: slurm

slice-uan:
  launch:
    environment:
      CTI_WLM_IMPL: slurm
