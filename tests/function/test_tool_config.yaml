---
# config for build time
build:
  # target specific checks and rules
  targets:
    all:
      j: 16
      optional-modules:
      - cray-cti-devel

# config for test time
test:
  modules:
    - gdb4hpc

# launcher config
launch:
  # launcher args are defined per test in gdb4hpc
  args:
    slurm: "--exclusive"
    alps: ""
    ssh: ""
  allocation:
    nodes: 6

# having to do with the test tool itself
meta:
  keep: # don't delete these files upon -r option
    - Makefile

# system specific overides
pea2k:
  launch:
    args:
      slurm: "--exclusive --mpi=cray_shasta"

pinoak-login1:
  launch:
    args:
      slurm: "--exclusive -N1"

uan01:
  launch:
    environment:
      CTI_WLM_IMPL: slurm

slice-uan:
  launch:
    environment:
      CTI_WLM_IMPL: slurm

pegasus:
  launch:
    args:
      # Multi-node MPI launches break if they include node007 or node008
      slurm: "--exclusive --exclude=node007,node008"

"*-aarch":
  launch:
    args:
      slurm: "-p aarch"
    allocation:
      # %%n%% replaced by /launch/allocation/nodes
      nodelist: "select=1:nodetype=mom-aarch64+%%n%%:nodetype=TX264,place=scatter"
