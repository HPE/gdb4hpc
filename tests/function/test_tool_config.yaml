---
# config for build time
build:
  # target specific checks and rules
  targets:
    all:
      j: 16
      modules:
      - cce/15.0.0
      optional-modules:
      - PrgEnv-cray
      - cray-cti-devel
    gnu:
      j: 16
      modules:
      - PrgEnv-gnu
      can-fail: yes
    amd:
      j: 16
      modules:
      - PrgEnv-amd
      can-fail: yes
    nvidia:
      j: 16
      modules:
      - PrgEnv-nvidia
      can-fail: yes
    intel:
      j: 16
      modules:
      - PrgEnv-intel
      can-fail: yes

# config for test time
test:
  modules:
    - gdb4hpc

# launcher config
launch:
  # use arguments without spaces to make automatic batch script creation easy.
  # for example, use "--time=5:00" instead of "-t 5:00".
  # rank/node count args are defined per test in gdb4hpc, so avoid -n and -N here.
  args:
    slurm: "--exclusive --time=5:00"
    alps: ""
    ssh: ""
    aprun: ""
    mpiexec: ""
    localhost: ""

# having to do with the test tool itself
meta:
  keep: # don't delete these files upon -r option
    - Makefile
  avocado-version: "100.0"

# system specific overides
horizon-aarch:
  launch:
    args:
      slurm: "--partition=aarch --exclusive --time=5:00"
    environment:
      GDB4HPC_STARTUP_TIMEOUT: "120"

kay:
  launch:
    allocation:
      nodes: 32

pinoak-login1:
  launch:
    args:
      slurm: "--exclusive --time=5:00 --partition=allnodes"

pegasus:
  launch:
    args:
      # Multi-node MPI launches break if they include node007 or node008
      slurm: "--exclusive --exclude=node007,node008 --time=5:00"
