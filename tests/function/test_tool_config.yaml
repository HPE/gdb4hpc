---
# config for build time
build:
  # target specific checks and rules
  targets:
    all:
      j: 16
      modules:
      - cce/15.0.0
      optional-modules:
      - PrgEnv-cray
      - cray-cti-devel
    gnu:
      j: 16
      modules:
      - PrgEnv-gnu
      can-fail: yes
    amd:
      j: 16
      modules:
      - PrgEnv-amd
      can-fail: yes
    nvidia:
      j: 16
      modules:
      - PrgEnv-nvidia
      can-fail: yes
    intel:
      j: 16
      modules:
      - PrgEnv-intel
      can-fail: yes

# config for test time
test:
  modules:
    - gdb4hpc

# launcher config
launch:
  # launcher args are defined per test in gdb4hpc
  args:
    slurm: "--exclusive -t 5:00"
    alps: ""
    ssh: ""
    aprun: ""
    mpiexec: ""
  allocation:
    nodes: 6

# having to do with the test tool itself
meta:
  keep: # don't delete these files upon -r option
    - Makefile
  avocado-version: latest

# system specific overides
pinoak-login1:
  launch:
    args:
      slurm: "--exclusive -t 5:00"

uan01:
  launch:
    environment:
      CTI_WLM_IMPL: slurm

pegasus:
  launch:
    args:
      # Multi-node MPI launches break if they include node007 or node008
      slurm: "--exclusive --exclude=node007,node008 -t 5:00"

kay:
  launch:
    allocation:
      nodelist: "place=scatter:shared,select=1:nodetype=mom-x86_64+%%n%%:nodetype=BW36:ncpus=8"

"*-aarch":
  launch:
    args:
      slurm: "-p aarch --exclusive -t 5:00"
    allocation:
      # %%n%% replaced by /launch/allocation/nodes
      nodelist: "select=1:nodetype=mom-aarch64+%%n%%:nodetype=TX264,place=scatter:shared"
